# ============================================================
# GeoVisio 上傳系統 - 可調校參數預設值
# ============================================================
# 此檔案管理所有「可調校」的參數預設值。
# 若需在特定部署環境覆蓋，可在 .env 中設定對應的環境變數。
# 優先順序：.env 環境變數 > config.toml > 程式碼內建預設值
# ============================================================

# ============================================================
# 上傳核心參數
# ============================================================
[upload]
# 最大並發上傳數（影響速度的關鍵參數）
#   保守: 5 | 標準: 10-15 | 激進: 20
max_concurrent = 10

# 單張圖片上傳超時（秒）
timeout = 60

# 序列間延遲（秒）—— 同一天內不同序列的間隔
sequence_delay = 2

# 日期組間延遲（秒）—— 不同日期間的間隔
#   保守: 300 | 標準: 60-120 | 激進: 30
batch_delay = 120

# ============================================================
# 連線設定
# ============================================================
[connection]
# aiohttp 連線池大小（應 >= upload.max_concurrent）
max_pool_size = 20

# DNS 快取時間（秒）
dns_cache_ttl = 300

# 連線建立超時（秒）
connect_timeout = 10

# 讀取回應超時（秒）
read_timeout = 60

# Keep-Alive 超時（秒）
keepalive_timeout = 30

# ============================================================
# 重試設定
# ============================================================
[retry]
# 上傳失敗重試次數
attempts = 3

# 重試最小等待時間（秒）
min_wait = 1

# 重試最大等待時間（秒）
max_wait = 30

# 重試間隔（秒，向後相容用）
delay = 2

# ============================================================
# 批次處理策略
# ============================================================
[batch]
# 序列大小分類閾值
small_threshold = 500    # < 此值為小型序列
medium_threshold = 2000  # < 此值為中型，>= 此值為大型

[batch.small]
# 小型序列配置（< 500 張）
size = 100
delay = 5
concurrent = 5

[batch.medium]
# 中型序列配置（500–2000 張）
size = 50
delay = 10
concurrent = 3

[batch.large]
# 大型序列配置（> 2000 張）
size = 30
delay = 15
concurrent = 2

# ============================================================
# 資源監控閾值（基於 Job Queue 積壓數量）
# ============================================================
[monitor]
# Job Queue < 此值時全速運行
job_queue_safe_threshold = 200

# Job Queue >= 此值時自動減速
job_queue_warning_threshold = 1000

# 資源狀態檢查間隔（秒）
resource_check_interval = 60

# ============================================================
# 去重檢查設定
# ============================================================
[dedup]
# KeyName/MD5 快取的最大數量
max_cache_size = 100000

# 啟動時預載入的快取數量
preload_limit = 50000

# 去重失敗行為："continue"（繼續上傳）或 "skip"（保守跳過）
failure_behavior = "continue"

# ============================================================
# 功能開關
# ============================================================
[features]
enable_deduplication = true
enable_md5_check = true       # 關閉可加快速度
enable_resource_monitor = true

# ============================================================
# Docker 容器監控（選用）
# ============================================================
[docker]
container_name = "geovisio_service"
hawser_port = 2376
monitor_interval = 300        # 監控頻率（秒）
monitor_mem_threshold_mb = 3072  # 記憶體告警門檻（3GB）
